name: RK2020 source gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq p7zip-full shellcheck xz-utils
      - name: Run source, identity, implementation, and release-script gates
        run: ./scripts/run-rk2020-source-gates.sh

  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Check release orchestration
        run: |
          shellcheck \
            scripts/run-rk2020-source-gates.sh \
            scripts/run-rk2020-strict-release-gate.sh \
            scripts/prepare-rk2020-release.sh \
            scripts/audit-rk2020-license-bundle.sh
