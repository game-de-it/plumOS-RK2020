input_driver = "udev"
input_device = "GO-Advance Gamepad"
input_vendor_id = "18507"
input_product_id = "4096"

# RK2020 joypad mapping for RetroArch's udev joypad driver.
#
# The stock RK3326 kernel exposes the left stick as ABS_X/ABS_Y and the D-pad,
# face, shoulder, and menu controls as evdev keys. RetroArch's udev driver maps
# those keys to compact button indices in scan order:
#
#   BTN_SOUTH=0 (physical B), BTN_EAST=1 (physical A),
#   BTN_NORTH=2, BTN_WEST=3,
#   BTN_TL=4, BTN_TR=5, DPAD_UP=6, DPAD_DOWN=7,
#   DPAD_LEFT=8, DPAD_RIGHT=9, F1/SELECT=10, F2/unwired=11,
#   F3/L2=12, F4/R2=13, F5/unwired=14, F6/START=15.
input_a_btn = "1"
input_b_btn = "0"
input_x_btn = "2"
input_y_btn = "3"
input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "12"
input_r2_btn = "13"
input_select_btn = "10"
input_start_btn = "15"
input_up_btn = "6"
input_down_btn = "7"
input_left_btn = "8"
input_right_btn = "9"
input_left_axis = "-0"
input_right_axis = "+0"
input_up_axis = "-1"
input_down_axis = "+1"
input_l_x_minus_axis = "-0"
input_l_x_plus_axis = "+0"
input_l_y_minus_axis = "-1"
input_l_y_plus_axis = "+1"
input_menu_toggle_btn = "0"
